<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoyo X Yaria - Game Launcher</title>
    <!-- استدعاء مكتبة Tailwind للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ألوان مطابقة لستايل Steam بالظبط */
        body { 
            background-color: #1b2838; /* لون خلفية ستيم الأساسي */
            color: #c7d5e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .sidebar { 
            background-color: #171a21; /* لون القائمة الجانبية */
        }
        .game-card { 
            background-color: #2a475e; /* لون كروت الألعاب */
            transition: transform 0.2s ease-in-out, box-shadow 0.2s; 
        }
        .game-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        /* الزرار الأخضر بتاع التشغيل زي ستيم */
        .play-btn { 
            background: linear-gradient(to bottom, #799905 5%, #536904 95%);
            color: #d2efa9; 
            text-shadow: 1px 1px rgba(0,0,0,0.3);
        }
        .play-btn:hover { 
            background: linear-gradient(to bottom, #8ed029 5%, #6aa614 95%);
            color: white;
        }
        .nav-item.active {
            color: #ffffff;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden select-none">

    <!-- القائمة الجانبية (Sidebar) -->
    <div class="sidebar w-64 p-6 flex flex-col justify-between shadow-2xl z-10">
        <div>
            <!-- اسم الموقع الخاص بك -->
            <h1 class="text-3xl font-extrabold text-white mb-10 tracking-wider text-center">
                Yoyo X <span class="text-blue-400">Yaria</span>
            </h1>
            
            <!-- القوائم (Store, Library, Friends) -->
            <ul class="space-y-2 text-lg">
                <li class="nav-item p-3 rounded cursor-pointer hover:bg-white hover:bg-opacity-5 hover:text-white transition flex items-center gap-2">
                    <span>🛒</span> المتجر (Store)
                </li>
                <li class="nav-item active p-3 rounded cursor-pointer transition flex items-center gap-2">
                    <span>📚</span> المكتبة (Library)
                </li>
                <li class="nav-item p-3 rounded cursor-pointer hover:bg-white hover:bg-opacity-5 hover:text-white transition flex items-center gap-2">
                    <span>👥</span> الأصدقاء (Friends)
                </li>
            </ul>
        </div>
        
        <!-- معلومات حساب اللاعب -->
        <div class="flex items-center gap-3 border-t border-gray-700 pt-4 cursor-pointer hover:text-white mt-auto">
            <div class="w-10 h-10 bg-gray-600 rounded-full border-2 border-blue-400"></div>
            <div>
                <div class="text-white font-bold text-sm">Player_Yoyo</div>
                <div class="text-xs text-blue-400">متصل (Online)</div>
            </div>
        </div>
    </div>

    <!-- مساحة عرض الألعاب (Main Content) -->
    <div class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-end mb-8 border-b border-gray-700 pb-4">
            <h2 class="text-3xl text-white font-bold uppercase tracking-wide">ألعابي</h2>
            <div class="text-sm text-gray-400">3 ألعاب جاهزة</div>
        </div>
        
        <!-- شبكة الألعاب -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            
            <!-- اللعبة الأولى -->
            <div class="game-card rounded shadow-lg overflow-hidden flex flex-col cursor-pointer">
                <!-- صورة غلاف اللعبة -->
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg" alt="CS2" class="w-full h-40 object-cover">
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <h3 class="text-white font-bold text-xl mb-1">Counter-Strike 2</h3>
                    <p class="text-xs text-gray-400 mb-4">وقت اللعب: 120 ساعة</p>
                    <button class="play-btn py-2 px-4 rounded font-bold w-full uppercase text-sm tracking-wider">
                        ▶ تشغيل
                    </button>
                </div>
            </div>

            <!-- اللعبة الثانية -->
            <div class="game-card rounded shadow-lg overflow-hidden flex flex-col cursor-pointer">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/570/header.jpg" alt="Dota 2" class="w-full h-40 object-cover">
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <h3 class="text-white font-bold text-xl mb-1">Dota 2</h3>
                    <p class="text-xs text-gray-400 mb-4">وقت اللعب: 45 ساعة</p>
                    <button class="play-btn py-2 px-4 rounded font-bold w-full uppercase text-sm tracking-wider">
                        ▶ تشغيل
                    </button>
                </div>
            </div>

             <!-- اللعبة الثالثة (مثال للعبة تحتاج تحديث) -->
            <div class="game-card rounded shadow-lg overflow-hidden flex flex-col cursor-pointer">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1172470/header.jpg" alt="Apex Legends" class="w-full h-40 object-cover">
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <h3 class="text-white font-bold text-xl mb-1">Apex Legends</h3>
                    <p class="text-xs text-yellow-500 mb-4">تحتاج إلى تحديث</p>
                    <!-- زر أزرق للتحديث -->
                    <button class="bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded font-bold w-full uppercase text-sm tracking-wider transition">
                        ↻ تحديث
                    </button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
