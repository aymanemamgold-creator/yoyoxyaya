<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر الألعاب - Yoyo X Yaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1b2838] text-white p-10 font-sans">

    <h1 class="text-3xl font-bold mb-8">متجر Yoyo X Yaya</h1>

    <!-- كارت اللعبة في المتجر -->
    <div class="bg-[#2a475e] w-80 p-5 rounded-lg shadow-lg text-center">
        <h2 class="text-2xl font-bold mb-2">Grand Theft Auto V</h2>
        <p class="text-gray-400 mb-4">لعبة عالم مفتوح وأكشن</p>
        
        <!-- المكان اللي هيظهر فيه السعر -->
        <div id="priceTag" class="text-xl font-bold mb-4"></div>
        
        <!-- زرار الشراء أو التحميل -->
        <button id="actionBtn" class="w-full py-3 rounded font-bold text-lg"></button>
    </div>

    <script>
        // هنا بنحدد مين اللي فاتح البرنامج دلوقتي
        // جرب تغير الاسم ده تخليه 'ahmed' أو أي اسم تاني وشوف اللي هيحصل!
        let currentUser = "yoyo"; 

        const admins = ["yoyo", "yaya"]; // قائمة أصحاب الموقع

        const priceTag = document.getElementById('priceTag');
        const actionBtn = document.getElementById('actionBtn');

        // الكود بيفحص: هل المستخدم ده أدمن ولا لأ؟
        if (admins.includes(currentUser)) {
            // لو هو yoyo أو yaya (كل حاجة ببلاش)
            priceTag.innerText = "مملوكة للمدير (مجاناً 🎁)";
            priceTag.className = "text-xl font-bold mb-4 text-green-400";
            
            actionBtn.innerText = "تحميل الآن مجاناً";
            actionBtn.className = "w-full py-3 rounded font-bold text-lg bg-green-600 hover:bg-green-500 text-white";
        
        } else {
            // لو مستخدم عادي (لازم يدفع)
            priceTag.innerText = "السعر: 50$";
            priceTag.className = "text-xl font-bold mb-4 text-white";
            
            actionBtn.innerText = "شراء اللعبة";
            actionBtn.className = "w-full py-3 rounded font-bold text-lg bg-blue-600 hover:bg-blue-500 text-white";
        }
    </script>

</body>
</html>
